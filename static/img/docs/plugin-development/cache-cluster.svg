<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
  <title>Clearing caches across servers</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="468" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- lane headers -->
  <rect x="40" y="20" width="160" height="58" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="120" y="44" text-anchor="middle" font-weight="600">Server A</text>
  <text x="120" y="64" text-anchor="middle" font-size="12" fill="#0969da">own local cache</text>

  <rect x="260" y="20" width="160" height="58" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="340" y="44" text-anchor="middle" font-weight="600">Database</text>
  <text x="340" y="64" text-anchor="middle" font-size="12" fill="#57606a">shared by all servers</text>

  <rect x="480" y="20" width="160" height="58" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="560" y="44" text-anchor="middle" font-weight="600">Hazelcast or Redis</text>
  <text x="560" y="64" text-anchor="middle" font-size="12" fill="#57606a">carries the resets</text>

  <rect x="700" y="20" width="160" height="58" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="780" y="44" text-anchor="middle" font-weight="600">Server B</text>
  <text x="780" y="64" text-anchor="middle" font-size="12" fill="#0969da">own local cache</text>

  <!-- lifelines -->
  <g stroke="#8c959f" stroke-dasharray="5 5">
    <line x1="120" y1="78" x2="120" y2="420"/>
    <line x1="340" y1="78" x2="340" y2="420"/>
    <line x1="560" y1="78" x2="560" y2="420"/>
    <line x1="780" y1="78" x2="780" y2="420"/>
  </g>

  <!-- stale window on B -->
  <rect x="772" y="112" width="16" height="192" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="764" y="150" text-anchor="end" font-size="13" fill="#bc4c00">B can still return</text>
  <text x="764" y="168" text-anchor="end" font-size="13" fill="#bc4c00">the old value</text>

  <!-- 1 commit -->
  <line x1="120" y1="112" x2="336" y2="112" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="230" y="104" text-anchor="middle" font-size="13">1. save and commit</text>

  <!-- 2 clear own -->
  <rect x="100" y="134" width="40" height="28" rx="4" fill="#ddf4ff" stroke="#0969da"/>
  <text x="150" y="153" font-size="13">2. clears its own cache</text>

  <!-- 3 broadcast -->
  <line x1="120" y1="196" x2="556" y2="196" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="400" y="188" text-anchor="middle" font-size="13">3. reset (table, record ID or key)</text>

  <!-- 4 deliver -->
  <line x1="560" y1="236" x2="776" y2="236" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="668" y="228" text-anchor="middle" font-size="13">4. deliver</text>

  <!-- 5 B clears -->
  <rect x="760" y="282" width="40" height="28" rx="4" fill="#ddf4ff" stroke="#0969da"/>
  <text x="752" y="272" text-anchor="end" font-size="13">5. after its stagger delay,</text>
  <text x="752" y="290" text-anchor="end" font-size="13">clears its own cache</text>

  <!-- 6 reload -->
  <line x1="780" y1="350" x2="344" y2="350" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="560" y="342" text-anchor="middle" font-size="13">6. next get on B loads the new row</text>

  <text x="450" y="448" text-anchor="middle" font-size="13" fill="#57606a">iDempiere 14. In 12 and 13, server A runs the reset on all servers and waits for them.</text>
</svg>
