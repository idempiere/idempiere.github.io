<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
  <title>Reading from and clearing a cache on one server</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="408" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- server boundary -->
  <rect x="16" y="16" width="584" height="378" rx="10" fill="none" stroke="#8c959f" stroke-dasharray="6 4"/>
  <text x="30" y="38" font-weight="600" fill="#57606a">One iDempiere server (JVM)</text>

  <!-- read path -->
  <rect x="30" y="60" width="220" height="100" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="140" y="100" text-anchor="middle" font-weight="600">Your code</text>
  <text x="140" y="124" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">MCharge.get(ctx, id)</text>

  <rect x="340" y="50" width="240" height="120" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="460" y="76" text-anchor="middle" font-weight="600">Local cache</text>
  <text x="460" y="100" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">ImmutableIntPOCache</text>
  <text x="460" y="122" text-anchor="middle" font-size="13">table: C_Charge</text>
  <text x="460" y="142" text-anchor="middle" font-size="13">key: C_Charge_ID</text>
  <text x="460" y="160" text-anchor="middle" font-size="12" fill="#57606a">registered in CacheMgt</text>

  <line x1="250" y1="76" x2="336" y2="76" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="293" y="70" text-anchor="middle" font-size="13">1. get</text>
  <line x1="338" y1="104" x2="254" y2="104" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="293" y="98" text-anchor="middle" font-size="13">2. hit</text>
  <line x1="250" y1="146" x2="336" y2="146" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="293" y="140" text-anchor="middle" font-size="13">4. put</text>
  <text x="293" y="164" text-anchor="middle" font-size="11" fill="#57606a">marks immutable</text>

  <!-- database -->
  <path d="M730,62 a75,14 0 0,1 150,0 v96 a75,14 0 0,1 -150,0 z" fill="#f6f8fa" stroke="#57606a"/>
  <path d="M730,62 a75,14 0 0,0 150,0" fill="none" stroke="#57606a"/>
  <text x="805" y="118" text-anchor="middle" font-weight="600">Database</text>

  <!-- 3 miss: the caller loads -->
  <path d="M110,160 V200 H785 V176" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="660" y="192" text-anchor="middle" font-size="13">3. miss: MCharge.get loads the record</text>

  <!-- write path -->
  <rect x="30" y="262" width="220" height="70" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="140" y="290" text-anchor="middle" font-weight="600">Your code</text>
  <text x="140" y="312" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">charge.saveEx() in trx</text>

  <rect x="340" y="262" width="240" height="86" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="460" y="286" text-anchor="middle" font-weight="600">Cache reset</text>
  <text x="460" y="308" text-anchor="middle" font-size="12" fill="#57606a">registered with the transaction</text>
  <text x="460" y="326" text-anchor="middle" font-size="12" fill="#57606a">runs after the commit</text>
  <text x="460" y="342" text-anchor="middle" font-size="12" fill="#57606a">rollback: nothing is cleared</text>

  <line x1="250" y1="290" x2="336" y2="290" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="293" y="282" text-anchor="middle" font-size="13">5. register</text>

  <path d="M140,332 V374 H825 V176" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="700" y="366" text-anchor="middle" font-size="13">6. commit</text>

  <line x1="460" y1="262" x2="460" y2="174" stroke="#bc4c00" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="450" y="224" text-anchor="end" font-size="12">7. background thread:</text>
  <text x="450" y="239" text-anchor="end" font-size="12">remove the record's entry,</text>
  <text x="450" y="254" text-anchor="end" font-size="12">or clear all (other key type)</text>
</svg>
